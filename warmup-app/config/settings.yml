# Behavior knobs for the warm-up / deliverability monitor.

mailbox:
  # How far back each daily sweep looks. Keep a little overlap so a late-arriving
  # message is not missed if a run is skipped.
  lookback_days: 3
  # Gmail's IMAP folder names. Change these for a non-Gmail provider.
  folders:
    inbox: "INBOX"
    spam: "[Gmail]/Spam"
    trash: "[Gmail]/Trash"
    all_mail: "[Gmail]/All Mail"
  # Gmail exposes tabs (Primary/Promotions/...) only through search, not as IMAP
  # folders, so placement detection uses X-GM-RAW queries. Set false for non-Gmail.
  use_gmail_categories: true

signup:
  # Seconds to wait for a signup form to appear before giving up on a site.
  form_timeout_s: 15
  # Sites that need a CAPTCHA are reported, never solved. They go to the
  # manual-signup list in the report.
  screenshot_failures: true

engagement:
  # The open/click/dwell layer. See README "What actually moves reputation" --
  # this produces engagement signal but is NOT what fixes sender reputation.
  enabled: true

  # HARD ALLOWLIST. A link is only ever followed if its host matches one of these
  # (exact match or subdomain). Default-deny: an empty list disables all clicking.
  # This keeps the crawler on properties you own even if an email embeds
  # third-party, affiliate, or ad links.
  allowed_domains: []

  # Per-message browsing budget.
  dwell_seconds_min: 45
  dwell_seconds_max: 75
  # Extra in-site navigations after the initial landing page.
  extra_clicks_min: 1
  extra_clicks_max: 3
  # Skip anything that looks like an unsubscribe / preference-center link.
  skip_link_patterns:
    - "unsubscribe"
    - "optout"
    - "opt-out"
    - "preferences"
    - "manage-subscription"
    - "email-preferences"
    - "profile-center"

report:
  # Flag a sender if its spam rate over the trailing window exceeds this.
  spam_rate_warn: 0.10
  trailing_days: 30

# Inputs for `warmup rampplan`. This is the part that actually improves
# sending-domain reputation.
rampplan:
  start_volume: 200
  growth_factor: 1.6
  days_per_step: 2
  max_daily: 250000
  # Widen the audience as the ramp progresses. recency_days = "opened or clicked
  # within the last N days". Ordered most-engaged first.
  engagement_tiers:
    - {name: "30-day engaged", recency_days: 30}
    - {name: "60-day engaged", recency_days: 60}
    - {name: "90-day engaged", recency_days: 90}
    - {name: "180-day engaged", recency_days: 180}
    - {name: "365-day active", recency_days: 365}
  # Advancement gates. If a metric breaches, hold volume flat instead of stepping up.
  gates:
    hard_bounce_rate_max: 0.01
    total_bounce_rate_max: 0.02
    complaint_rate_max: 0.001
    delivery_rate_min: 0.95
