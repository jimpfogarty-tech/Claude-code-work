name: Warm-up tests

on:
  push:
    paths:
      - "warmup-app/**"
      - ".github/workflows/warmup-tests.yml"
  pull_request:
    paths:
      - "warmup-app/**"
      - ".github/workflows/warmup-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warmup-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: warmup-app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -q
